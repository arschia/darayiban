name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "app/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "scripts/prepare-android-assets.mjs"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "scripts/prepare-android-assets.mjs"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://iilpkekzjbwqlvjtcbqs.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_u8xauuLIw8TwZHzDFzzpxQ_n-g3vkH_
      NEXT_PUBLIC_SITE_URL: https://selfmali.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync Capacitor
        run: npm run android:sync

      - name: Build and lint Android app
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace

      - name: Verify APK signature and assistant assets
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | sed -n '1,5p'
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              scripts = [name for name in apk.namelist() if name.startswith('assets/public/') and name.endswith('.js')]
              assert any(b'financial-assistant' in apk.read(name) for name in scripts), 'Assistant missing from APK'
              assert not any(name.endswith('.apk') for name in apk.namelist()), 'Nested APK found'
          print('Assistant verified inside the signed APK')
          PY

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: darayiban-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-android:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-debug-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: android-v1.1.0
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: darayiban-android-debug
          path: release-apk

      - name: Publish the Android assistant release
        run: |
          mv release-apk/app-debug.apk release-apk/darayiban-android.apk
          (cd release-apk && sha256sum darayiban-android.apk > darayiban-android.apk.sha256)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This version is already published; increment the version and release tag for a new release."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release-apk/darayiban-android.apk release-apk/darayiban-android.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "دارایی‌بان اندروید ۱.۱.۰ با دستیار Gemini" \
            --notes-file docs/ANDROID_1.1.0.md
